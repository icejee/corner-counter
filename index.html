<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />

<meta name="description" content="A fast, modern offline-first Point of Sale system for small counters, pop-ups, and retail." />

<!-- PWA / install-to-homescreen / Icons -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#090D16" />
<meta name="background-color" content="#090D16" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="shortcut icon" href="icons/favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Corner Counter" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Google Fonts (with system fallback) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=16" />

<!-- Local Offline Celebration Effects -->
<script src="js/confetti.js" defer></script>
</head>
<body data-theme="dark">
<canvas id="stars-canvas" class="cosmic-stars-canvas"></canvas>
<div id="app"></div>

<script>
  window.process = window.process || {};
  window.process.env = window.process.env || {};
  window.process.env.NEXT_PUBLIC_API_URL = window.process.env.NEXT_PUBLIC_API_URL || "https://corner-counter-2.onrender.com";
</script>
<script src="js/storage.js?v=16" defer></script>
<script src="js/bluetooth-printer.js?v=16" defer></script>
<script src="js/audio.js?v=16" defer></script>
<script src="js/stars.js?v=16" defer></script>
<script src="js/app.js?v=16" defer></script>
<script>
  // Register Offline Service Worker with automatic update & controllerchange reload
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=16', { scope: './' })
        .then((registration) => {
          console.log('PWA Service Worker registered with scope:', registration.scope);
          // Check for immediate worker updates
          registration.update();
        })
        .catch((error) => {
          console.warn('Service Worker registration failed:', error);
        });
    });
  }
</script>
<!-- PWA install prompt handler for Android/Chrome -->
<script>
  (function(){
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // create or show the install button
      let el = document.getElementById('pwa-install');
      if (!el) {
        el = document.createElement('div');
        el.id = 'pwa-install';
        el.className = 'pwa-install show';
        el.innerHTML = '<button id="pwa-install-btn">Install App</button>';
        document.body.appendChild(el);
        document.getElementById('pwa-install-btn').addEventListener('click', async () => {
          el.classList.remove('show');
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          deferredPrompt = null;
        });
      } else {
        el.classList.add('show');
      }
    });
    // hide after appinstalled
    window.addEventListener('appinstalled', () => {
      const el = document.getElementById('pwa-install');
      if (el) el.classList.remove('show');
      deferredPrompt = null;
    });
  })();
</script>
</body>
</html>
